services:
  - type: web
    name: mathquest-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false # Set to Vercel production frontend URL
      - key: GROQ_API_KEY
        sync: false # Required: supply production Groq API Key in Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # BLOCKED FOR LIVE DEMO: Requires a hosted production MongoDB service. Cannot connect to localhost:27017 from Render.

